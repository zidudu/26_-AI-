<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Media Library</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <header><span class="mark" aria-hidden="true">▶</span><div><strong>YouTube Media</strong><small>Library 연결</small></div></header>
    <section class="current" aria-live="polite">
      <span class="eyebrow">현재 탭</span>
      <h1 id="page-title">확인 중…</h1>
      <p id="page-message">YouTube 영상 또는 재생목록을 열어 주세요.</p>
    </section>
    <button id="send" class="primary" disabled>수집 창에 보내기</button>
    <section class="manual" aria-labelledby="manual-title">
      <label id="manual-title" for="manual-url">링크 직접 넣기</label>
      <p id="manual-help">현재 탭을 읽지 못하거나 나중에 받은 링크도 넣을 수 있습니다.</p>
      <form id="manual-form" novalidate>
        <input id="manual-url" type="url" inputmode="url" autocomplete="url" spellcheck="false" maxlength="2048" aria-describedby="manual-help" placeholder="https://youtu.be/…">
        <button id="manual-send" class="secondary" type="submit">링크로 수집 창 열기</button>
      </form>
    </section>
    <button id="library" class="secondary">라이브러리 열기</button>
    <p class="note">저장 항목과 화질을 확인한 뒤 대기열에 추가합니다.</p>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
</body>
</html>

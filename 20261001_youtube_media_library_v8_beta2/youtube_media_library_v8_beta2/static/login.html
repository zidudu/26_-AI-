<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로그인 · YouTube Media V8 beta.2</title><link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/login.css"><script src="/static/login.js" defer></script></head>
<body><main class="login-shell"><section class="intro"><div class="wordmark"><span class="logo" aria-hidden="true">▶</span> YouTube Media <span class="version">V8 beta.2</span></div><h1>내 라이브러리를,<br>어디에서나.</h1><p>저장한 영상과 자막, 정리해 둔 태그까지.<br>PC의 자료를 휴대폰에서도 이어서 확인하세요.</p><div class="intro-footer">개인 서버 · 파일은 서버 PC에 보관됩니다.</div></section><section class="signin"><div class="form-heading"><h2>라이브러리 로그인</h2><p>서버 PC에서 설정한 계정으로 접속하세요.</p></div><form id="login-form"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" maxlength="80" required autofocus autocapitalize="none" spellcheck="false"><label for="password">비밀번호</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><button id="show-password" type="button" aria-label="비밀번호 표시" aria-pressed="false">표시</button></div><label class="remember-row" for="remember"><input id="remember" name="remember" type="checkbox"><span><strong>이 기기에서 자동 로그인</strong><small>30일 동안 로그인 상태를 유지합니다.</small></span></label><p id="login-error" class="error" role="alert" hidden></p><button class="submit" id="submit" type="submit">로그인</button></form><p class="help">비밀번호를 잊으셨나요?<br>서버 PC에서 <code>01_setup_beta.bat</code>을 실행해 재설정하세요.</p><p class="connection">외부 접속은 등록된 HTTPS 주소를 사용합니다.<br>PC가 꺼지거나 절전 상태이면 연결할 수 없습니다.</p></section></main></body></html>

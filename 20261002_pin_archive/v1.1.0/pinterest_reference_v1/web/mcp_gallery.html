<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pin Archive 갤러리</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 16px; color: light-dark(#182026, #f2f4f6); background: light-dark(#f6f8fa, #171b20); }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
    h2 { font-size: 17px; margin: 0; }
    #count { font-size: 12px; opacity: .7; }
    #gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    figure { margin: 0; overflow: hidden; border: 1px solid light-dark(#dbe2e8, #333b45); border-radius: 12px; background: light-dark(#fff, #232a31); }
    .image-box { display: grid; place-items: center; height: 210px; background: light-dark(#eef2f5, #101418); }
    img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
    figcaption { padding: 9px 11px; font-size: 13px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
    #message { font-size: 13px; opacity: .75; }
    @media (max-width: 440px) { #gallery { grid-template-columns: 1fr; } .image-box { height: 240px; } }
  </style>
</head>
<body>
  <header><h2>Pin Archive</h2><span id="count"></span></header>
  <div id="message">이미지를 불러오는 중입니다.</div>
  <main id="gallery" aria-label="Pin Archive 이미지 갤러리"></main>
  <script>
    const gallery = document.getElementById('gallery');
    const message = document.getElementById('message');
    const count = document.getElementById('count');
    const pending = new Map();
    let nextId = 0;
    let generation = 0;

    function request(method, params) {
      const id = ++nextId;
      return new Promise((resolve, reject) => {
        pending.set(id, {resolve, reject});
        window.parent.postMessage({jsonrpc:'2.0', id, method, params}, '*');
      });
    }

    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function loadThumbnail(id) {
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const response = await request('tools/call', {name:'get_image', arguments:{pin_id:id}});
          const contents = response?.content || response?.result?.content || [];
          const image = contents.find(x => x?.type === 'image' && x.mimeType === 'image/webp' && typeof x.data === 'string');
          if (image) return image;
        } catch {
          // The tunnel can briefly reject a request while a gallery is opening.
        }
        if (attempt < 2) await delay(300 * (attempt + 1));
      }
      return null;
    }

    async function render(result, content = []) {
      if (!result || !Array.isArray(result.items)) return;
      const current = ++generation;
      gallery.replaceChildren();
      const items = result.items.filter(x => x && /^[a-f0-9]{32}$/.test(x.id)).slice(0, 6);
      const inlineImages = content.filter(x => x?.type === 'image' && x.mimeType === 'image/webp' && typeof x.data === 'string');
      count.textContent = `${items.length}장`;
      message.textContent = items.length ? '' : '표시할 이미지가 없습니다.';
      for (const [index, item] of items.entries()) {
        const card = document.createElement('figure');
        const box = document.createElement('div');
        const caption = document.createElement('figcaption');
        box.className = 'image-box';
        box.textContent = '불러오는 중…';
        caption.textContent = item.title || '제목 없음';
        card.append(box, caption);
        gallery.append(card);
        try {
          const image = inlineImages[index] || await loadThumbnail(item.id);
          if (current !== generation) return;
          if (!image) { box.textContent = '이미지를 표시할 수 없습니다.'; continue; }
          const img = document.createElement('img');
          img.alt = item.title || 'Pin Archive 이미지';
          img.src = `data:image/webp;base64,${image.data}`;
          box.replaceChildren(img);
        } catch {
          if (current === generation) box.textContent = '이미지를 불러오지 못했습니다.';
        }
      }
    }

    window.addEventListener('message', event => {
      if (event.source !== window.parent) return;
      const data = event.data;
      if (!data || data.jsonrpc !== '2.0') return;
      if (typeof data.id === 'number' && pending.has(data.id)) {
        const call = pending.get(data.id);
        pending.delete(data.id);
        if (data.error) call.reject(data.error); else call.resolve(data.result);
      } else if (data.method === 'ui/notifications/tool-result') {
        render(data.params?.structuredContent, data.params?.content || []);
      }
    }, {passive:true});

    request('ui/initialize', {
      appInfo:{name:'pinarchive-gallery', version:'1.0.0'},
      appCapabilities:{}, protocolVersion:'2026-01-26'
    }).then(() => {
      window.parent.postMessage({jsonrpc:'2.0', method:'ui/notifications/initialized', params:{}}, '*');
      render(window.openai?.toolOutput, window.openai?.toolResponseMetadata?.content || []);
    }).catch(() => { message.textContent = '갤러리를 시작할 수 없습니다.'; });
  </script>
</body>
</html>
